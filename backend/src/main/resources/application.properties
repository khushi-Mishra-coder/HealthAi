# ==============================================================================
# Personalized AI Health Assistant - Backend Configuration
# ==============================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Info
spring.application.name=personalized-ai-health-assistant

# ------------------------------------------------------------------------------
# Database Configuration
# Default: File-based PostgreSQL-compatible database for instant out-of-the-box run
# Override with PostgreSQL server: set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/healthai_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# JWT Security Configuration
# ------------------------------------------------------------------------------
healthai.jwt.secret=${JWT_SECRET:healthAiSecretKeyMustBeAtLeast256BitsLongForHmacShaSecurity2026}
healthai.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# Jackson JSON Settings
# ------------------------------------------------------------------------------
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------------------------
# ML Microservice Configuration
# ------------------------------------------------------------------------------
healthai.ml.service-url=${ML_SERVICE_URL:http://localhost:8000}
healthai.ml.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:3000}
healthai.ml.read-timeout-ms=${ML_READ_TIMEOUT_MS:5000}

