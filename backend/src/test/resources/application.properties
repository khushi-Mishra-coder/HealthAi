# Test Environment Configuration (Fast in-memory DB in PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:healthai_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

healthai.jwt.secret=testHealthAiSecretKeyMustBeAtLeast256BitsLongForHmacShaSecurity2026
healthai.jwt.expiration-ms=3600000
